name: Elixir CI

# Define workflow that runs when changes are pushed to the
# `main` branch or pushed to a PR branch that targets the `main`
# branch. Change the branch name if your project uses a
# different name for the main branch like "master" or "production".
on:
  push:
    branches: ["main"] # adapt branch for project
  pull_request:
    branches: ["main"] # adapt branch for project

# Sets the ENV `MIX_ENV` to `test` for running tests
env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  # Builds the test matrix from a single source of truth and computes the
  # latest Elixir version, so version-specific steps (e.g. format check)
  # can pin to "latest" without hardcoding a version string.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      latest: ${{ steps.build.outputs.latest }}
    steps:
      # Each row pairs an Elixir version with a supported OTP release,
      # spanning OTP 25 -> 28 so we exercise older toolchains too.
      # To add a new version, edit this list only.
      - name: Build matrix and resolve latest Elixir
        id: build
        run: |
          include='[
            {"elixir":"1.15","otp":"25"},
            {"elixir":"1.16","otp":"26"},
            {"elixir":"1.17","otp":"26"},
            {"elixir":"1.18","otp":"27"},
            {"elixir":"1.19","otp":"27"},
            {"elixir":"1.20","otp":"28"}
          ]'
          echo "matrix={\"include\":$(echo "$include" | jq -c .)}" >> "$GITHUB_OUTPUT"
          echo "latest=$(echo "$include" | jq -r '.[].elixir' | sort -V | tail -n1)" >> "$GITHUB_OUTPUT"

  test:
    # Additional services can be defined here if required.
    needs: setup

    runs-on: ubuntu-latest
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      # Don't cancel the whole matrix when one (older) version fails —
      # we want to see exactly which combinations work.
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.8.0"

      - name: Install Yaci DevKit
        run: npm install -g @bloxbean/yaci-devkit

      - name: Start Yaci DevKit in background
        run: nohup  yaci-devkit up --enable-yaci-store &

      - name: Wait for Yaci DevKit to start
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Yaci DevKit is up!"
              exit 0
            fi
            echo "Waiting for Yaci DevKit to start..."
            sleep 5
          done
          echo "Yaci DevKit failed to start" >&2
          exit 1

      - name: Setup Libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          sudo apt-get install -y libsodium-dev

      # Step: Setup Elixir + Erlang image as the base.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      # Step: Check out the code.
      - name: Checkout code
        uses: actions/checkout@v3

      # Step: Define how to cache deps. Restores existing cache if present.
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v3
        env:
          cache-name: cache-elixir-deps
        with:
          path: deps
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-${{ env.cache-name }}-

      # Step: Define how to cache the `_build` directory. After the first run,
      # this speeds up tests runs a lot. This includes not re-compiling our
      # project's downloaded deps every run.
      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@v3
        env:
          cache-name: cache-compiled-build
        with:
          path: _build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-${{ env.cache-name }}-
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-

      # Step: Download project dependencies. If unchanged, uses
      # the cached version.
      - name: Install dependencies
        run: mix deps.get

      # Step: Compile the project treating any warnings as errors.
      # Customize this step if a different behavior is desired.
      - name: Compiles without warnings
        run: mix compile --warnings-as-errors

      # Step: Check that the checked in code has already been formatted.
      # This step fails if something was found unformatted.
      # Only run on the latest Elixir version — formatter output can differ
      # between versions, so older toolchains would flag false positives.
      - name: Check Formatting
        if: ${{ matrix.elixir == needs.setup.outputs.latest }}
        run: mix format --check-formatted

      - name: Check for code consistency
        run: mix credo --strict

      # Step: Execute the tests.
      - name: Run tests
        run: mix test
